<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>儀器閾值設定 — 遙測作業系統資料傳輸監控整合平台</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="layout">
  <!-- 頁首（共用元件，見 js/header.js） -->
  <script src="/js/header.js" data-active="settings" data-no-refresh></script>

  <!-- 內容區塊 -->
  <div class="page-body">
    <!-- 區域導覽 -->
    <aside class="local-nav">
      <h3 class="local-nav-title">設定項目</h3>
      <a href="#threshold-section" class="local-nav-item active">儀器閾值</a>
    </aside>

    <!-- 主要內容 -->
    <main class="main-content">
      <div id="status-bar" class="status-bar hidden"></div>
      <section id="threshold-section" class="section">
        <h2>各儀器最大時間差閾值（分鐘）</h2>
        <table id="threshold-table">
          <thead>
            <tr>
              <th>儀器代碼</th>
              <th>設備名稱</th>
              <th style="color:#facc15">黃色閾值（分鐘）</th>
              <th style="color:#fb923c">橙色閾值（分鐘）</th>
              <th style="color:#ef4444">紅色閾值（分鐘）</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="threshold-tbody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- 頁尾 -->
  <footer class="site-footer">
    <span>© 2026 中央氣象署海氣遙測組 遙測作業系統資料傳輸監控整合平台 | 聯絡我們：遙測應用科</span>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
