<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首頁 — 遙測作業系統資料傳輸監控整合平台</title>
  <link rel="stylesheet" href="/css/style.css?v=20261116a" />
</head>
<body class="layout">
  <!-- 頁首（共用元件，見 js/header.js） -->
  <script src="/js/header.js?v=20261113b" data-active="index"></script>

  <!-- 內容區塊（單欄） -->
  <div class="page-body">
    <main class="main-content">
      <div id="status-bar" class="status-bar hidden"></div>

      <div class="home-columns">
        <!-- 左欄：儀器運作狀態 + 電腦使用排行榜（較寬）-->
        <div class="home-col-left">
          <section class="section">
            <h2>儀器運作狀態</h2>
            <div id="instruments-container" class="group-cards">
              <p class="loading">載入中…</p>
            </div>
          </section>

          <!-- 電腦使用排行榜（置於儀器運作狀態下方、各科電腦與檔案左方）-->
          <section class="section">
            <h2>電腦使用排行榜</h2>
            <div class="dashboard-grid">
              <!-- CPU 負載 Top 5 -->
              <div class="dash-panel">
                <h2 class="panel-title">CPU 負載 TOP 5 電腦</h2>
                <div id="top-cpu" class="bar-list">
                  <p class="loading">載入中…</p>
                </div>
              </div>

              <!-- 記憶體使用率 Top 5 -->
              <div class="dash-panel">
                <h2 class="panel-title">記憶體使用率 TOP 5 電腦</h2>
                <div id="top-memory" class="bar-list">
                  <p class="loading">載入中…</p>
                </div>
              </div>

              <!-- 磁碟使用率 Top 5 -->
              <div class="dash-panel">
                <h2 class="panel-title">磁碟使用率 TOP 5 電腦</h2>
                <div id="top-disk" class="bar-list">
                  <p class="loading">載入中…</p>
                </div>
              </div>
            </div>
          </section>
        </div>

        <!-- 右欄：各科電腦與檔案（約一欄寬）-->
        <section class="section home-col-right">
          <h2>各科電腦與檔案</h2>
          <div id="computers-container" class="group-cards">
            <p class="loading">載入中…</p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 頁尾 -->
  <footer class="site-footer">
    <span>© 2026 中央氣象署海氣遙測組 遙測作業系統資料傳輸監控整合平台 | 聯絡我們：遙測應用科</span>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/labels.js?v=20261113"></script>
  <script src="/js/mainpage.js?v=20261117c"></script>
</body>
</html>
