<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>溫溼度歷史資料 — 遙測作業系統資料傳輸監控整合平台</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .history-header-info {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .history-header-info strong {
      color: #e2e8f0;
    }

    .range-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .range-btn {
      background: #1e2235;
      color: #94a3b8;
      border: 1px solid #2d3148;
      border-radius: 6px;
      padding: 5px 16px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .range-btn:hover {
      background: #2d3148;
      color: #e2e8f0;
    }
    .range-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    .chart-wrapper {
      position: relative;
      height: 280px;
    }

    .no-data {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.9rem;
    }
    .no-data.hidden { display: none; }

    .env-charts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      margin-top: 16px;
    }

    .env-chart-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 16px 18px;
    }

    .env-chart-card h3 {
      font-size: 0.92rem;
      font-weight: 600;
      color: #7dd3fc;
      margin-bottom: 12px;
      border-bottom: 1px solid #2d3148;
      padding-bottom: 6px;
    }

    @media (min-width: 2560px) {
      .chart-wrapper { height: 400px; }
    }
    @media (min-width: 3600px) {
      .chart-wrapper { height: 480px; }
    }
  </style>
</head>
<body class="layout">
  <!-- 頁首（含全域導覽列） -->
  <header class="site-header">
    <div class="header-title">
      <div class="header-line1">中央氣象署海氣遙測組</div>
      <div class="header-line2">遙測作業系統資料傳輸監控整合平台</div>
    </div>
    <nav class="header-nav">
      <a href="/instruments.html" class="global-nav-link">儀器即時狀況</a>
      <a href="/computers.html" class="global-nav-link">電腦即時狀況</a>
      <a href="/settings.html" class="global-nav-link">閾值設定</a>
      <a href="/environment-history.html?ip=192.168.178.19" class="global-nav-link active">環境監控</a>
    </nav>
    <div class="time-bar">
      <span class="history-header-info">IP：<strong id="header-ip">--</strong></span>
      <span class="history-header-info">設備：<strong id="header-name">溫溼度計</strong></span>
    </div>
  </header>

  <main>
    <div id="status-bar" class="status-bar hidden"></div>

    <div class="section">
      <h2>環境溫溼度歷史</h2>

      <div class="range-bar">
        <button class="range-btn active" data-range="6h">6 小時</button>
        <button class="range-btn" data-range="1d">1 天</button>
        <button class="range-btn" data-range="1w">1 週</button>
        <button class="range-btn" data-range="1m">1 個月</button>
        <button class="range-btn" data-range="3m">3 個月</button>
      </div>

      <div class="env-charts-grid">
        <!-- 溫度圖 -->
        <div class="env-chart-card">
          <h3>溫度（°C）</h3>
          <div class="chart-wrapper">
            <canvas id="temperature-chart"></canvas>
            <div id="temperature-no-data" class="no-data hidden">此時間範圍內無資料</div>
          </div>
        </div>

        <!-- 濕度圖 -->
        <div class="env-chart-card">
          <h3>濕度（%RH）</h3>
          <div class="chart-wrapper">
            <canvas id="humidity-chart"></canvas>
            <div id="humidity-no-data" class="no-data hidden">此時間範圍內無資料</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/environment-history.js"></script>
</body>
</html>
