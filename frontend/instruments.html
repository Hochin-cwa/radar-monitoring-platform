<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>儀器即時狀況 — 遙測作業系統資料傳輸監控整合平台</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="layout">
  <!-- 頁首（含全域導覽列） -->
  <header class="site-header">
    <div class="header-title">
      <div class="header-line1">中央氣象署海氣遙測組</div>
      <div class="header-line2">遙測作業系統資料傳輸監控整合平台</div>
    </div>
    <nav class="header-nav">
      <a href="/index.html" class="global-nav-link">首頁</a>
      <a href="/instruments.html" class="global-nav-link active">儀器即時狀況</a>
      <a href="/computers.html" class="global-nav-link">電腦即時狀況</a>
      <a href="/settings.html" class="global-nav-link">閾值設定</a>
    </nav>
    <div class="time-bar">
      <span>本地時間：<span id="local-time">--</span></span>
      <span>UTC：<span id="utc-time">--</span></span>
      <span class="refresh-info">
        上次更新：<span id="last-refreshed">--</span>
        <button id="btn-refresh">⟳ 刷新</button>
      </span>
    </div>
  </header>

  <!-- 內容區塊 -->
  <div class="page-body">
    <!-- 區域導覽（科別篩選） -->
    <aside class="local-nav">
      <h3 class="local-nav-title">科別篩選</h3>
      <button class="dept-btn active" data-dept="all">全部</button>
      <button class="dept-btn" data-dept="wrs">氣象雷達科</button>
      <button class="dept-btn" data-dept="mrs">海象雷達科</button>
      <button class="dept-btn" data-dept="sos">衛星作業科</button>
      <button class="dept-btn" data-dept="dqcs">品管科</button>
      <button class="dept-btn" data-dept="rsa">應用科</button>
    </aside>

    <!-- 主要內容 -->
    <main class="main-content">
      <div id="status-bar" class="status-bar hidden"></div>
      <section class="section">
        <h2>儀器警示狀態</h2>
        <div id="instruments-container" class="instruments-grid">
          <p class="loading">載入中…</p>
        </div>
      </section>
    </main>
  </div>

  <!-- 頁尾 -->
  <footer class="site-footer">
    <span>© 2026 中央氣象署海氣遙測組 遙測作業系統資料傳輸監控整合平台 | 聯絡我們：遙測應用科</span>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/instruments.js"></script>
</body>
</html>
