<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>儀器即時狀況 — 遙測作業系統資料傳輸監控整合平台</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="layout">
  <!-- 頁首（共用元件，見 js/header.js） -->
  <script src="/js/header.js" data-active="instruments"></script>

  <!-- 內容區塊 -->
  <div class="page-body">
    <!-- 區域導覽（科別篩選） -->
    <aside class="local-nav">
      <h3 class="local-nav-title">科別篩選</h3>
      <button class="dept-btn active" data-dept="all">全部</button>
      <button class="dept-btn" data-dept="wrs">氣象雷達科</button>
      <button class="dept-btn" data-dept="mrs">海象雷達科</button>
      <button class="dept-btn" data-dept="sos">衛星作業科</button>
      <button class="dept-btn" data-dept="dqcs">品管科</button>
      <button class="dept-btn" data-dept="rsa">應用科</button>
    </aside>

    <!-- 主要內容 -->
    <main class="main-content">
      <div id="status-bar" class="status-bar hidden"></div>
      <section class="section">
        <h2>儀器警示狀態</h2>
        <div id="instruments-container" class="instruments-grid">
          <p class="loading">載入中…</p>
        </div>
      </section>

      <!-- 電腦資源 TOP 5 面板 -->
      <section class="section">
        <div class="dashboard-grid">
          <!-- CPU 負載 Top 5 -->
          <div class="dash-panel">
            <h2 class="panel-title">CPU 負載 TOP 5 電腦</h2>
            <div id="top-cpu" class="bar-list">
              <p class="loading">載入中…</p>
            </div>
          </div>

          <!-- 記憶體使用率 Top 5 -->
          <div class="dash-panel">
            <h2 class="panel-title">記憶體使用率 TOP 5 電腦</h2>
            <div id="top-memory" class="bar-list">
              <p class="loading">載入中…</p>
            </div>
          </div>

          <!-- 磁碟使用率 Top 5 -->
          <div class="dash-panel">
            <h2 class="panel-title">磁碟使用率 TOP 5 電腦</h2>
            <div id="top-disk" class="bar-list">
              <p class="loading">載入中…</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 頁尾 -->
  <footer class="site-footer">
    <span>© 2026 中央氣象署海氣遙測組 遙測作業系統資料傳輸監控整合平台 | 聯絡我們：遙測應用科</span>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/instruments.js"></script>
</body>
</html>
