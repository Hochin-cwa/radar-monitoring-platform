server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # ── 安全性標頭（修正 ZAP 掃描之 CSP / Clickjacking / MIME-sniffing 弱點）──
    # 隱藏 nginx 版本資訊（Server Leaks Version Information）
    server_tokens off;

    # 內容安全策略：允許本站資源 + Chart.js CDN；
    # 允許 inline style/script（頁面含內嵌 <style> 與 index.html 的導向 <script>）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # 防點擊劫持（Missing Anti-clickjacking Header）
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 防 MIME sniffing（X-Content-Type-Options Header Missing）
    add_header X-Content-Type-Options "nosniff" always;

    # 首頁導向至儀器即時狀況頁面
    location = / {
        return 302 /instruments.html;
    }

    # 前端靜態檔案
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /instruments.html;
    }

    # API proxy 到後端（支援所有 HTTP 方法，包含 POST/PUT）
    location /api/ {
        proxy_pass http://host.containers.internal:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
